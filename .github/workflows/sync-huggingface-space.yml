# Keeps this GitHub repo in sync with your Hugging Face Space (official pattern).
# Docs: https://huggingface.co/docs/hub/spaces-github-actions
#
# Setup:
# 1. Hugging Face → Settings → Access Tokens → create token with "write" (repo).
# 2. GitHub repo → Settings → Secrets and variables → Actions → New repository secret → HF_TOKEN
# 3. Edit HF_USERNAME / SPACE_NAME below if yours differ.

name: Sync to Hugging Face Space

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    env:
      HF_USERNAME: PritDhabaliya
      SPACE_NAME: Kyron-medical
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME}" "HEAD:main"
